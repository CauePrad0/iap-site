# Uso:
#   docker compose up                      → site em modo desenvolvimento: http://localhost:5173
#   docker compose --profile prod up prod  → build final com nginx:        http://localhost:8080
# Os modos mock/Supabase são escolhidos no arquivo .env (veja .env.example).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app                      # código montado → hot reload
      - node_modules:/app/node_modules  # node_modules do container (Linux), separado do seu
    environment:
      # Garante o hot reload mesmo quando o sistema não repassa eventos de arquivo ao container
      WATCH_POLLING: "true"
    # O Vite lê o arquivo .env direto da pasta montada; sem .env = modo mock.

  prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://exemplo.org}
    ports:
      - "${PROD_PORT:-8080}:80"   # mude com PROD_PORT=8081 se a 8080 estiver ocupada

volumes:
  node_modules:
